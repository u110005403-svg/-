let n,sc,e,ok,$=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

 if(n>=N){$("#p").textContent="完成";$("#c").innerHTML=`<p class="q">得分 ${sc} / ${N}</p><button class="b" onclick="go()">再來一次</button>`;return}
 e=R[Math.random()*R.length|0];const m=+$("#m").value,t=m<0?Q[Math.random()*5|0]:Q[m],g=t[1];
 let pl=sh(R.filter(x=>x[g]!=e[g]));if(g==2)pl.sort((a,b)=>(a[3]==e[3]?0:1)-(b[3]==e[3]?0:1));

 $("#p").textContent=`第 ${n+1} / ${N} 題`;$("#s").textContent=`答對 ${sc}`;

 if($("#x").innerHTML)return;const r=b.dataset.v==ok;sc+=r;n++;
 document.querySelectorAll(".o").forEach(o=>{if(o.dataset.v==ok)o.classList.add("ok");else if(o==b)o.classList.add("no")});
 $("#s").textContent=`答對 ${sc}`;
 $("#x").innerHTML=`<div class="i">${r?"✓ 答對了":"✗ 答錯了"}<br>${e[0]}｜${e[1]}｜${e[2]}｜${e[3]}｜${e[4]}</div><button class="b" onclick="nx()">${n>=N?"看結果":"下一題"}</button>`}
